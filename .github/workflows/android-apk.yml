name: Build Galaxy APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundled offline APK
        run: bash artifacts/haruyak/scripts/build-android.sh
        env:
          CI: "1"
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: haruyak-galaxy-apk
          path: generated-artifacts/android/haruyak.apk
          retention-days: 14
